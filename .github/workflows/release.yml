name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.4.2)'
        required: true
        default: 'v0.4.2'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and Setup AutoHotkey v1.1
        shell: pwsh
        run: |
          $zipPath = "$env:TEMP\AutoHotkey.zip"
          Write-Host "Downloading AutoHotkey 1.1.37.02 from official GitHub releases..."
          Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "C:\AutoHotkey" -Force
          if (-not (Test-Path "C:\AutoHotkey\Compiler\Ahk2Exe.exe")) {
            throw "Failed to extract Ahk2Exe compiler."
          }
          Write-Host "AutoHotkey 1.1.37.02 successfully installed to C:\AutoHotkey"

      - name: Compile mouse2joystick to EXE
        shell: pwsh
        run: |
          cmd.exe /c '"C:\AutoHotkey\Compiler\Ahk2Exe.exe" /in mouse2joystick_Custom_CEMU.ahk /out mouse2joystick_Custom_CEMU.exe /bin "C:\AutoHotkey\Compiler\Unicode 64-bit.bin"'
          if (-not (Test-Path "mouse2joystick_Custom_CEMU.exe")) {
            throw "Compilation failed: mouse2joystick_Custom_CEMU.exe was not created."
          }
          Write-Host "Successfully compiled mouse2joystick_Custom_CEMU.exe"

      - name: Package Release ZIP
        shell: pwsh
        run: |
          $dist = "dist_package"
          New-Item -ItemType Directory -Path $dist -Force
          Copy-Item "mouse2joystick_Custom_CEMU.exe" -Destination $dist
          Copy-Item "mouse2joystick_Custom_CEMU.ahk" -Destination $dist
          Copy-Item "settings.ini" -Destination $dist
          Copy-Item "SavedKeyLists.ini" -Destination $dist
          Copy-Item "README.md" -Destination $dist
          Copy-Item "controllerProfiles" -Destination $dist -Recurse
          Copy-Item "CvJI" -Destination $dist -Recurse
          Copy-Item "Layouts_1.8" -Destination $dist -Recurse
          Copy-Item "ScpVBus" -Destination $dist -Recurse

          Compress-Archive -Path "$dist\*" -DestinationPath "mouse2joystick_Custom_CEMU.zip" -Force
          Write-Host "Successfully created mouse2joystick_Custom_CEMU.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mouse2joystick_Custom_CEMU.exe
            mouse2joystick_Custom_CEMU.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
